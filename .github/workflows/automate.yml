name: Automation Task

on:
  workflow_dispatch:

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Run automation
        id: run
        continue-on-error: true
        run: python automate.py

      - name: Retry on failure
        if: steps.run.outcome == 'failure'
        run: python automate.py --retry 1

      - name: Upload all outputs
        uses: actions/upload-artifact@v4
        with:
          name: 面试流程输出
          path: |
            *.xlsx
            output.json
          if-no-files-found: warn

      - name: Generate summary
        if: success()
        run: |
          echo "## ✅ 杉树公益 · 面试流程自动化完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "生成文件清单：" >> $GITHUB_STEP_SUMMARY
          ls -lh *.xlsx output.json >> $GITHUB_STEP_SUMMARY

      - name: Notify failure
        if: failure()
        run: |
          echo "## ❌ 自动化失败 $(date)" >> $GITHUB_STEP_SUMMARY
